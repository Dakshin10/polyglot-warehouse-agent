[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-warehouse-agent"
version = "0.1.0"
description = "Polyglot warehouse agent data pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "pandas",
    "numpy",
    "sqlalchemy",
    "pymysql",
    "psycopg2-binary",
    "pg8000",
    "cloud-sql-python-connector[pg8000]",
    "google-cloud-bigquery",
    "google-cloud-bigquery-connection",
    "kaggle",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
pwa = "pwa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pwa.sql" = ["**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: mark test as requiring live cloud credentials (skipped by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 35
