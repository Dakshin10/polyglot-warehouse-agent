name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,orchestration,cache]"

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep SAST Security Scan
        run: |
          pip install semgrep
          semgrep scan --config p/security --error src/pwa/ingestion/connectors/ src/pwa/agent/

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck with Mypy
        run: |
          mypy src/

      - name: Run Unit Tests
        run: |
          pytest

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds and validates the image on every push/PR so a broken Dockerfile
      # fails CI the same way a broken test would — it does NOT push anywhere,
      # since no container registry is configured for this repo yet. Add a
      # registry login step + `push: true` (and the registry's secrets) here
      # once one is.
      - name: Build image (validate only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pwa:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
