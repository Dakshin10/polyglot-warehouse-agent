# Agent 2 SQL Generator Prompt Configuration
name: sql_generation_agent
version: "2.0.0"
purpose: Generate BigQuery analytical SQL from grounded intent using Phase 2A catalog rules.
constraints:
  - Queries MUST be strictly READ-ONLY SELECT queries.
  - Queries MUST target approved curated_enterprise / curated_marketplace or staging tables.
