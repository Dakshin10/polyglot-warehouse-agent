  fact_marketplace_order:
    entity_name: "Marketplace Order"
    description: "External marketplace order transaction headers"
    dataset: "curated_marketplace"
    physical_table: "curated_marketplace.fact_marketplace_order"
    grain: "one row per marketplace order header"
    primary_key: ["source_order_id"]
    source_systems: ["olist"]
    timestamp_column: "order_purchase_timestamp"

  fact_marketplace_order_item:
    entity_name: "Marketplace Order Line Item"
    description: "External marketplace order line item detail"
    dataset: "curated_marketplace"
    physical_table: "curated_marketplace.fact_marketplace_order_item"
    grain: "one row per marketplace order line item"
    primary_key: ["order_item_sk"]
    source_systems: ["olist"]
