  fact_marketplace_payment:
    entity_name: "Marketplace Payment"
    description: "External marketplace order payment transactions"
    dataset: "curated_marketplace"
    physical_table: "curated_marketplace.fact_marketplace_payment"
    grain: "one row per marketplace order payment"
    primary_key: ["source_order_id"]
    source_systems: ["olist"]
    timestamp_column: "created_at"

  fact_marketplace_review:
    entity_name: "Marketplace Customer Review"
    description: "External marketplace customer reviews"
    dataset: "curated_marketplace"
    physical_table: "curated_marketplace.fact_marketplace_review"
    grain: "one row per customer review"
    primary_key: ["source_review_id"]
    source_systems: ["olist"]
    timestamp_column: "review_date"

  fact_marketing_lead:
    entity_name: "Marketing Qualified Lead"
    description: "Marketing qualified lead records"
    dataset: "curated_marketplace"
    physical_table: "curated_marketplace.fact_marketing_lead"
    grain: "one row per MQL"
    primary_key: ["source_mql_id"]
    source_systems: ["olist_marketing"]
    timestamp_column: "first_contact_date"

  fact_closed_deal:
    entity_name: "Closed Marketing Deal"
    description: "Closed deals connecting leads to marketplace sellers"
    dataset: "curated_marketplace"
    physical_table: "curated_marketplace.fact_closed_deal"
    grain: "one row per closed deal"
